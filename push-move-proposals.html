function renderCards(){

    <div class="card" id="card${i}">
      <h3>${p.nome} <span class="status pending" id="st${i}">Pendente</span></h3>
      <div class="meta">${p.lj} lojas | ${p.ct} meses | R$ ${p.ms}/loja/mes | Rollout ${p.ro} meses</div>
      <div class="details">
        <strong>Modulos:</strong> ${p.modulos.join(', ')}<br>
        <strong>Setup:</strong> ${p.ixSetup?'ISENTO':'R$ '+p.setup.toLocaleString('pt-BR')}<br>
        <strong>Instalacao:</strong> ${p.ixInst?'ISENTA':'R$ '+p.inst.toLocaleString('pt-BR')}
      </div>
      <div class="offer">
        <div style="margin-bottom:6px;font-size:14px;">Oferta Move:</div>
        ${p.moveOfertas.map(o=>'- '+o).join('<br>')}
        <div style="margin-top:8px;font-size:11px;opacity:.7;">Validade: ${validadeStr}</div>
      </div>
    </div>
  `).join('');
}

// ─── GitHub API ───
async function ghApi(path,opts={}){
  const url=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`;
  const res=await fetch(url,{
    headers:{
      'Authorization':'token '+GH.token,
      'Accept':'application/vnd.github.v3+json',
      'Content-Type':'application/json',
      ...opts.headers
    },
    method:opts.method||'GET',
    body:opts.body||undefined
  });
  return res.json();
}

function log(msg,cls=''){
  const el=document.getElementById('log');
  el.style.display='block';
  el.innerHTML+=`<div class="line ${cls}">${new Date().toLocaleTimeString('pt-BR')} — ${msg}</div>`;
  el.scrollTop=el.scrollHeight;
}

async function pushAll(){
  const btn=document.getElementById('btnPush');
  btn.disabled=true;
  btn.textContent='Enviando...';
  log('Iniciando envio de '+PROPOSTAS.length+' propostas Move...');

  for(let i=0;i<PROPOSTAS.length;i++){
    const p={...PROPOSTAS[i]};
    const label=p._label;
    delete p._label;

    const filename=`propostas/${p.nome.replace(/[^a-zA-Z0-9\s]/g,'').replace(/\s+/g,'_')}_MOVE_${p.id}.json`;
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(p,null,2))));

    log(`[${i+1}/${PROPOSTAS.length}] Enviando: ${p.nome}...`);

    try{
      const body=JSON.stringify({
        message: `[iFood Move] ${p.nome} — proposta especial`,
        content: content
      });
      const res=await ghApi(filename,{method:'PUT',body});

      if(res.content&&res.content.sha){
        log(`OK: ${p.nome} salvo com sucesso!`,'ok');
        document.getElementById('st'+i).className='status ok';
        document.getElementById('st'+i).textContent='Enviado';
      }else{
        log(`AVISO: ${p.nome} — resposta: ${JSON.stringify(res).substring(0,200)}`,'err');
        document.getElementById('st'+i).className='status err';
        document.getElementById('st'+i).textContent='Erro';
      }
    }catch(e){
      log(`ERRO: ${p.nome} — ${e.message}`,'err');
      document.getElementById('st'+i).className='status err';
      document.getElementById('st'+i).textContent='Erro';
    }

    // Small delay between requests
    if(i<PROPOSTAS.length-1) await new Promise(r=>setTimeout(r,500));
  }

  log('Processo finalizado! Abra a Caixa de Ferramentas para ver as propostas.','ok');
  btn.textContent='Concluido!';
}
